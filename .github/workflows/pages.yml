name: Deploy serving-benchmark report to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './serving-benchmark/report/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: ./serving-benchmark/report

      - name: Build project
        run: npm run build
        working-directory: ./serving-benchmark/report

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./serving-benchmark/report/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
